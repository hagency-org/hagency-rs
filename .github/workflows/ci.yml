name: CI
# The fast lane for every PR and every push to main: one Ubuntu runner with
# the formatting, lint, spec-binding and production-caller gates and the
# workspace tests. The macOS/Windows matrix, the console browser tests and the
# release build live in rust.yml (nightly, releases and major PRs).
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'knowledge/**', 'README.md', 'README.zh-CN.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', 'knowledge/**', 'README.md', 'README.zh-CN.md']
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-ubuntu
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: node native/scripts/check-rust-spec-bindings.mjs
      - run: node --test native/scripts/check-production-callers.test.mjs
      - run: node native/scripts/check-production-callers.mjs
      # The same two by-name skips as rust.yml: both selectors need a real
      # qualified host (ADR-140, ADR-144) and stay listed for the binding gate.
      - run: cargo test --workspace --all-targets --locked --no-fail-fast -- --skip native_codex_real_app_server --skip native_two_agent_qualification_records_its_evidence
