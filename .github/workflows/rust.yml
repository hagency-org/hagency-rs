name: Full matrix
# The expensive lane: Ubuntu, macOS and Windows tests, the console browser
# tests, the Linux cgroup qualification and a release build. Every PR already
# gets the fast Ubuntu lane in ci.yml; this one runs
#   - nightly (and opens/closes a regression issue on the scheduled run),
#   - on manual dispatch and on `nv*` release tags,
#   - before a native release build (release-native.yml calls it),
#   - on "major" PRs: labelled `full-ci`, or touching the paths in `scope`.
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
  workflow_call:
  push:
    tags: ['nv*']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
concurrency:
  group: full-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide whether this event needs the full matrix
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          run=true
          if [ "$EVENT" = "pull_request" ]; then
            run=false
            if jq -e 'index("full-ci")' <<<"$LABELS" >/dev/null; then
              run=true
            else
              files=$(git diff --name-only "$BASE" HEAD)
              echo "$files"
              # Platform-sensitive code, the console, dependencies, the toolchain
              # and CI/deploy definitions. Here-strings, not pipes: under
              # pipefail an early grep -q exit can SIGPIPE the producer.
              if grep -qE '^(native/hagency-(platform|runtime|execution|files|media-store|matrix)/|native/hagency/src/(console|runner|bootstrap)|mockup/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.github/workflows/|deploy/|install/)' <<<"$files"; then
                run=true
              fi
            fi
          fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"
  console-browser:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-console-browser
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: mockup/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: mockup
      - name: Install the explicit browser test prerequisite
        working-directory: mockup
        run: npx --no-install playwright-core install --with-deps chromium
      - name: Build retained native console assets
        run: node mockup/scripts/build-native-console.mjs --output "$RUNNER_TEMP/native-console-assets"
      - name: Qualify actual browser and native executable
        shell: bash
        run: |
          export HAGENCY_NATIVE_CONSOLE_ASSETS="$RUNNER_TEMP/native-console-assets"
          export HAGENCY_BROWSER_NODE="$(command -v node)"
          export HAGENCY_BROWSER_CHROME="$(cd mockup && node -e 'process.stdout.write(require("playwright-core").chromium.executablePath())')"
          # Failure-path screenshots only: the browser drivers skip their
          # routine screenshots when a native executable is under test.
          export HAGENCY_CONSOLE_SCREENSHOTS="$RUNNER_TEMP/console-screenshots"
          mkdir -p "$HAGENCY_CONSOLE_SCREENSHOTS"
          cargo clippy --locked -p hagency --all-targets --features native-console-browser -- -D warnings
          # Each browser test starts Chromium and retains a complete asset
          # snapshot. Bound their concurrency while running every assertion.
          cargo test --locked -p hagency --features native-console-browser --test console -- --nocapture --test-threads=2
      - name: Keep console failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: console-failure-screenshots
          path: ${{ runner.temp }}/console-screenshots
          if-no-files-found: ignore
  native:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    # 2026-09-13 operator decision: Windows is not a release target for now (no
    # coding agent runs on Windows). The lane keeps running for its diagnostics,
    # but its verdict no longer blocks the run; Ubuntu and macOS are the gate.
    continue-on-error: ${{ matrix.os == 'windows-2025' }}
    # Hosted Windows at c96f76c: clippy 2 min, spec-binding inventory 7 min,
    # full tests 17 min (720 passed), then the release build ran past the old
    # 40-minute limit. Budget the whole job; no test deadline changes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: node native/scripts/check-rust-spec-bindings.mjs
      - run: node --test native/scripts/check-production-callers.test.mjs
      - run: node native/scripts/check-production-callers.mjs
      - id: native-tests
        # ADR-144's operator-run qualification test fails (never skips inside
        # a test) while its evidence record is a placeholder — by design.
        # Hosted runners have no real Palpo homeserver and no real owner
        # client, and will never have real evidence, so the suite here skips
        # that ONE selector BY NAME; the selector stays present for the
        # spec-binding gate's --list inventory, the skip is recorded in this
        # workflow (never inside a test), and the operator runs it on a
        # qualified host per the ADR-144 runbook. The codex qualification
        # skip (ADR-140, native_codex_real_app_server) is the same class and
        # rides the same line; both stay present for the --list inventory.
        run: cargo test --workspace --all-targets --locked --no-fail-fast -- --skip native_codex_real_app_server --skip native_two_agent_qualification_records_its_evidence
      - name: Qualify default Windows media storage with fresh process restoration
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          cargo build --locked -p hagency-media-store --example windows_directory_flush
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $PSNativeCommandUseErrorActionPreference = $false
          & target/debug/examples/windows_directory_flush.exe *> windows-media-sync-original.log
          $syncExit = $LASTEXITCODE
          "original_exit=$syncExit" | Set-Content windows-media-sync-verdict.txt
          Get-Content windows-media-sync-original.log
          exit $syncExit
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: windows-media-sync-original
          path: |
            windows-media-sync-original.log
            windows-media-sync-verdict.txt
          if-no-files-found: warn
      - name: Diagnose the Windows Matrix outgoing library after original failure
        if: failure() && runner.os == 'Windows' && steps.native-tests.outcome == 'failure'
        timeout-minutes: 5
        # The original suite remains fatal. This runs the actual failing library
        # selectors with the same workspace/all-target feature selection,
        # including unchanged deadlines and refusal assertions.
        run: cargo test --workspace --all-targets --locked native_matrix_outgoing -- --test-threads=1 --nocapture
      - name: Diagnose Windows transport failures without replacing their verdict
        if: failure() && runner.os == 'Windows' && steps.native-tests.outcome == 'failure'
        timeout-minutes: 8
        # The original full-suite failure remains fatal. This unchanged, serial
        # fixture run distinguishes repeatable failures from concurrent load;
        # it neither widens a production deadline nor counts as a successful retry.
        run: cargo test --locked -p hagency-matrix -p hagency-palpo --test transport --no-fail-fast -- --test-threads=1 --nocapture
      - name: Diagnose a closed Windows MCP helper transport under the same load
        if: failure() && runner.os == 'Windows' && steps.native-tests.outcome == 'failure'
        timeout-minutes: 6
        # The MCP catalog failure has only been seen under parallel load, so a
        # serial re-run would hide it; the fixture now reports the helper's
        # try_wait state when tools/list fails. Diagnostic only, never a retry.
        run: cargo test --locked -p hagency --test mcp_coordination --no-fail-fast -- --test-threads=8 --nocapture
      - name: Qualify Linux cgroup recovery on a disposable hosted VM
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 -B native/scripts/test-qualify-linux-cgroup.py
          cargo build --locked -p hagency-platform --bins
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,RUNNER_ARCH /usr/bin/python3 -B native/scripts/qualify-linux-cgroup.py --probe "$PWD/target/debug/hagency-cgroup-probe" --uid "$(id -u)" --gid "$(id -g)"
      - run: cargo build --release --locked -p hagency
      - uses: actions/upload-artifact@v4
        with:
          name: hagency-foundation-${{ matrix.os }}
          path: |
            target/release/hagency
            target/release/hagency.exe
          if-no-files-found: error
  regression-issue:
    name: Reconcile nightly regression issue
    needs: [console-browser, native]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RESULTS: ${{ toJSON(needs) }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ISSUE_TITLE: "[nightly] Full matrix regression"
    steps:
      - name: Open, refresh, or close the regression issue
        run: |
          set -euo pipefail
          failed=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "- `\(.key)`: **\(.value.result)**"' <<<"$RESULTS")
          gh label create nightly-regression --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "Failure in the scheduled full matrix" --force
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label nightly-regression \
            --json number --jq '.[0].number // empty')
          if [ -n "$failed" ]; then
            body=$(printf 'The scheduled full matrix failed.\n\n%s\n\n[Open the run](%s)' "$failed" "$RUN_URL")
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --label nightly-regression --body "$body"
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "The scheduled full matrix is green again: $RUN_URL"
          else
            echo "Full matrix is green; no open regression issue."
          fi
